[package]
name = "aether-desk"
version = "0.1.0"
edition = "2021"
description = "Aether native desk — GPUI trading terminal"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
gpui = "0.2.2"
gpui-component = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }

[profile.dev]
opt-level = 0
